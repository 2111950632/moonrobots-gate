name: ci

on:
  push:
  pull_request:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: moonbitlang/setup-moonbit@v1
      - run: moon info
      - run: moon fmt --check
      - run: moon check
      - run: moon build
      - run: moon test
      - run: moon package --list
